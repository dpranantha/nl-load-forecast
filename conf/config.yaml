# --- Data window -------------------------------------------------------------
data:
  country_code: "NL"
  start: "2023-01-01"
  end: "2024-12-31"
  timezone: "Europe/Amsterdam"
  # De Bilt (KNMI reference station) — a reasonable single-point proxy for NL weather.
  weather_latitude: 52.10
  weather_longitude: 5.18
  cache_dir: "data"

# --- Features ----------------------------------------------------------------
features:
  target: "load_mw"
  weather_vars: ["temperature_2m", "wind_speed_10m", "shortwave_radiation"]
  lags_hours: [24, 48, 168]          # yesterday, 2 days, last week (same hour)
  rolling_windows_hours: [24, 168]   # daily and weekly rolling means
  add_calendar: true
  add_weather_derived: true          # HDH/CDH + wind chill (temp x wind interaction)
  add_momentum: true                 # day-over-day diff + recent volatility (rolling std)

# --- Model -------------------------------------------------------------------
model:
  quantiles: [0.1, 0.5, 0.9]
  lgbm_params:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8

# --- Backtest ----------------------------------------------------------------
backtest:
  horizon_hours: 24        # day-ahead
  n_folds: 12              # rolling-origin folds
  initial_train_days: 180  # first training window
  step_days: 30            # advance the origin by this each fold

# --- MLflow ------------------------------------------------------------------
mlflow:
  experiment_name: "nl-load-forecast"
  registered_model_name: "nl_load_quantile_lgbm"
