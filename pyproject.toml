[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-load-forecast"
version = "0.1.0"
description = "Probabilistic day-ahead electricity load forecasting for the Netherlands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "entsoe-py>=0.8.0",
    "pandas>=2.2.0",
    "numpy>=2.1.3",
    "requests>=2.34.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
    "mlflow>=3.1.0",
    "holidays>=0.101",
    "pyyaml>=6.0.3",
    "matplotlib>=3.10.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Enable E (incl. E402) + F explicitly so behaviour is deterministic across ruff versions.
# pipeline.py sets matplotlib's backend before importing pyplot, so its `# noqa: E402` is real.
select = ["E", "F"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
